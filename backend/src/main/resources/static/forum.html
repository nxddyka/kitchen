<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>讨论社区 · 智能厨房辅助系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/theme.css">
    <style>
        .post-item {
            background: var(--white);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            transition: var(--transition);
            padding: 20px;
            margin-bottom: 16px;
            cursor: pointer;
        }
        .post-item:hover {
            box-shadow: var(--shadow-hover);
            transform: translateX(4px);
            border-left: 4px solid var(--primary-color);
        }
        .post-item-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 8px;
        }
        .post-item-meta {
            display: flex;
            gap: 16px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            align-items: center;
        }
        .post-item-meta span i { margin-right: 4px; }
        .post-item-summary {
            color: var(--text-secondary);
            margin: 8px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .post-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: var(--white); display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 0.9rem; flex-shrink: 0;
        }
        .post-author-row {
            display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
        }
        .post-detail-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 10000;
            display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .post-detail-overlay.show { display: flex; }
        .post-detail-panel {
            background: var(--white); border-radius: var(--radius-lg);
            max-width: 700px; width: 100%; max-height: 80vh; overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .comment-item {
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .comment-item:last-child { border-bottom: none; }
        .comment-author-row {
            display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
        }
    </style>
</head>
<body>

<!-- 导航栏 -->
<div id="navbar"></div>

<!-- 主内容区 -->
<div class="container-main">
    <div class="messages-container" id="messagesContainer"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="page-header mb-0">
            <i class="fas fa-comments me-2"></i>讨论社区
        </h3>
        <button class="btn btn-primary" onclick="showPostForm()">
            <i class="fas fa-pen me-1"></i>发帖
        </button>
    </div>

    <!-- 帖子列表 -->
    <div id="postList">
        <div class="text-center py-5">
            <i class="fas fa-spinner fa-spin fa-2x text-primary"></i>
            <p class="mt-3 text-secondary">加载中...</p>
        </div>
    </div>

    <!-- 分页 -->
    <nav class="mt-4 d-none" id="paginationNav">
        <ul class="pagination justify-content-center" id="pagination"></ul>
    </nav>
</div>

<!-- 帖子详情弹窗 -->
<div class="post-detail-overlay" id="postDetailOverlay" onclick="closePostDetail(event)">
    <div class="post-detail-panel" onclick="event.stopPropagation()">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span id="detailTitle">帖子详情</span>
            <button class="modal-close-btn" onclick="closePostDetail()">&times;</button>
        </div>
        <div class="card-body" id="detailBody">
            <div class="text-center py-4">
                <i class="fas fa-spinner fa-spin text-primary"></i>
                <p class="mt-2 text-secondary">加载中...</p>
            </div>
        </div>
    </div>
</div>

<!-- 页脚 -->
<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/theme.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById('navbar').innerHTML = renderNavbar('forum');
document.getElementById('footer').innerHTML = renderFooter();

Auth.requireLogin();

// 帖子列表（使用 mock 数据，后端论坛接口待补充）
const mockPosts = [
    { id: 1, title: '番茄炒蛋的秘诀是什么？', author: '美食爱好者', authorInitial: '美', section: '菜谱讨论', summary: '每次做番茄炒蛋都感觉差点意思，是番茄要去皮还是鸡蛋要先炒？大家来分享下经验...', likes: 25, comments: 8, views: 156, createdAt: '2026-08-20 14:30', isEssential: true },
    { id: 2, title: '分享一道家常红烧肉的做法', author: '厨房小白', authorInitial: '厨', section: '菜谱分享', summary: '肥而不腻的红烧肉，关键在于炒糖色和炖煮时间。下面是我的详细步骤...', likes: 42, comments: 15, views: 320, createdAt: '2026-08-19 10:15', isEssential: true },
    { id: 3, title: '秋天适合吃什么食材？', author: '健康饮食', authorInitial: '健', section: '食材百科', summary: '换季了，想了解秋天有哪些应季食材适合日常烹饪？', likes: 18, comments: 6, views: 89, createdAt: '2026-08-18 16:45', isEssential: false },
    { id: 4, title: '新手学厨：刀工练习心得', author: '厨艺新人', authorInitial: '厨', section: '经验交流', summary: '从切土豆丝开始练习，总结了一些入门技巧和大家分享...', likes: 30, comments: 12, views: 200, createdAt: '2026-08-17 09:20', isEssential: false },
];

function loadPosts(page = 1) {
    const postList = document.getElementById('postList');

    // 模拟数据（后端接口就绪后替换为 Api.get('/posts', {page, size})）
    setTimeout(() => {
        if (mockPosts.length === 0) {
            postList.innerHTML = `<div class="text-center py-5">
                <i class="fas fa-comments fa-3x text-secondary opacity-50"></i>
                <p class="mt-3 text-secondary">暂无帖子，快来发第一帖吧！</p>
            </div>`;
            return;
        }

        postList.innerHTML = mockPosts.map(post => `
            <div class="post-item" onclick="showPostDetail(${post.id})">
                <div class="post-author-row">
                    <div class="post-avatar">${post.authorInitial}</div>
                    <div>
                        <div class="author-link">${Utils.escapeHtml(post.author)}</div>
                        <div class="timestamp">${post.createdAt}</div>
                    </div>
                    ${post.isEssential ? '<span class="badge bg-warning"><i class="fas fa-star me-1"></i>精华</span>' : ''}
                </div>
                <div class="post-item-title">${Utils.escapeHtml(post.title)}</div>
                <div class="post-item-summary">${Utils.escapeHtml(post.summary)}</div>
                <div class="post-item-meta">
                    <span><i class="fas fa-tag"></i>${Utils.escapeHtml(post.section)}</span>
                    <span><i class="fas fa-heart"></i>${post.likes}</span>
                    <span><i class="fas fa-comment"></i>${post.comments}</span>
                    <span><i class="fas fa-eye"></i>${post.views}</span>
                </div>
            </div>
        `).join('');

        document.getElementById('paginationNav').classList.add('d-none');
    }, 500);
}

function showPostDetail(id) {
    const overlay = document.getElementById('postDetailOverlay');
    const body = document.getElementById('detailBody');
    const title = document.getElementById('detailTitle');

    overlay.classList.add('show');
    title.textContent = '帖子详情';
    body.innerHTML = '<div class="text-center py-4"><i class="fas fa-spinner fa-spin text-primary"></i><p class="mt-2 text-secondary">加载中...</p></div>';

    // 模拟详情数据
    setTimeout(() => {
        const post = mockPosts.find(p => p.id === id);
        if (!post) {
            body.innerHTML = '<p class="text-danger">帖子不存在</p>';
            return;
        }

        title.textContent = post.title;
        body.innerHTML = `
            <div class="post-author-row mb-3">
                <div class="post-avatar">${post.authorInitial}</div>
                <div>
                    <div class="author-link">${Utils.escapeHtml(post.author)}</div>
                    <div class="timestamp">${post.createdAt}</div>
                </div>
                <span class="badge bg-primary">${Utils.escapeHtml(post.section)}</span>
                ${post.isEssential ? '<span class="badge bg-warning">精华</span>' : ''}
            </div>
            <div class="mb-3">${Utils.escapeHtml(post.summary)}</div>
            <div class="d-flex gap-3 mb-4 text-secondary">
                <button class="btn btn-outline-primary btn-sm" onclick="ToastManager.info('点赞功能开发中')">
                    <i class="fas fa-heart"></i> ${post.likes}
                </button>
                <button class="btn btn-outline-primary btn-sm" onclick="ToastManager.info('收藏功能开发中')">
                    <i class="fas fa-bookmark"></i> 收藏
                </button>
                <button class="btn btn-outline-primary btn-sm" onclick="ToastManager.info('分享功能开发中')">
                    <i class="fas fa-share"></i> 分享
                </button>
            </div>
            <hr>
            <h6 class="text-primary-dark mb-3"><i class="fas fa-comments me-2"></i>评论 (${post.comments})</h6>
            <div id="commentList">
                <div class="comment-item">
                    <div class="comment-author-row">
                        <div class="post-avatar" style="width:28px;height:28px;font-size:0.75rem;">A</div>
                        <span class="author-link">用户A</span>
                        <span class="timestamp">2026-08-20 15:00</span>
                    </div>
                    <p class="mb-0">番茄一定要去皮，口感更好！</p>
                </div>
                <div class="comment-item">
                    <div class="comment-author-row">
                        <div class="post-avatar" style="width:28px;height:28px;font-size:0.75rem;">B</div>
                        <span class="author-link">用户B</span>
                        <span class="timestamp">2026-08-20 15:30</span>
                    </div>
                    <p class="mb-0">鸡蛋先炒到半凝固再盛出，最后和番茄一起翻炒。</p>
                </div>
            </div>
            <div class="mt-3">
                <textarea class="form-control" rows="2" placeholder="写评论..." id="commentInput"></textarea>
                <button class="btn btn-primary mt-2" onclick="ToastManager.success('评论功能开发中')">
                    <i class="fas fa-paper-plane me-1"></i>发表评论
                </button>
            </div>
        `;
    }, 500);
}

function closePostDetail(event) {
    if (event && event.target !== document.getElementById('postDetailOverlay')) return;
    document.getElementById('postDetailOverlay').classList.remove('show');
}

function showPostForm() {
    ModalManager.open({
        title: '发布新帖',
        body: `
            <div class="mb-3">
                <label class="form-label">标题</label>
                <input type="text" class="form-control" id="postTitleInput" placeholder="请输入帖子标题" maxlength="200">
            </div>
            <div class="mb-3">
                <label class="form-label">内容</label>
                <textarea class="form-control" id="postContentInput" rows="5" placeholder="请输入帖子内容..."></textarea>
            </div>
        `,
        confirmText: '发布',
        onConfirm: () => {
            const title = document.getElementById('postTitleInput').value.trim();
            if (!title) {
                ToastManager.warning('请输入帖子标题');
                return false;
            }
            ToastManager.info('发帖功能开发中，敬请期待');
        }
    });
}

// ESC 关闭详情
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closePostDetail();
});

loadPosts();
</script>
</body>
</html>

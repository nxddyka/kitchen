<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菜谱中心 · 智能厨房辅助系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/theme.css">
    <style>
        .recipe-card {
            background: var(--white);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            transition: var(--transition);
            overflow: hidden;
            cursor: pointer;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .recipe-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-4px);
        }
        .recipe-card-img {
            width: 100%;
            height: 200px;
            overflow: hidden;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .recipe-card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .recipe-card:hover .recipe-card-img img {
            transform: scale(1.05);
        }
        .recipe-card-img-placeholder {
            font-size: 3rem;
            color: var(--primary-color);
            opacity: 0.4;
        }
        .recipe-card-body {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .recipe-card-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .recipe-card-desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .recipe-card-meta {
            display: flex;
            gap: 12px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .recipe-card-meta span i { margin-right: 4px; }
        .difficulty-1 { color: var(--success-color); }
        .difficulty-2 { color: var(--warning-color); }
        .difficulty-3 { color: var(--danger-color); }
    </style>
</head>
<body>

<!-- 导航栏 -->
<div id="navbar"></div>

<!-- 主内容区 -->
<div class="container-main">
    <div class="messages-container" id="messagesContainer"></div>

    <h3 class="page-header">
        <i class="fas fa-book-open me-2"></i>菜谱中心
    </h3>

    <!-- 搜索栏 -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-8">
                    <label class="form-label">搜索菜谱</label>
                    <input type="text" class="form-control" id="keywordInput"
                           placeholder="输入菜谱名称..." value="">
                </div>
                <div class="col-md-4">
                    <button class="btn btn-primary w-100" onclick="loadRecipes(1)">
                        <i class="fas fa-search me-1"></i>搜索
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 菜谱卡片网格 -->
    <div id="recipeGrid" class="row g-4">
        <div class="col-12 text-center py-5">
            <i class="fas fa-spinner fa-spin fa-2x text-primary"></i>
            <p class="mt-3 text-secondary">加载中...</p>
        </div>
    </div>

    <!-- 分页 -->
    <nav class="mt-4 d-none" id="paginationNav">
        <ul class="pagination justify-content-center" id="pagination"></ul>
    </nav>
</div>

<!-- 页脚 -->
<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/theme.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById('navbar').innerHTML = renderNavbar('recipes');
document.getElementById('footer').innerHTML = renderFooter();

Auth.requireLogin();

const difficultyMap = { 1: '简单', 2: '中等', 3: '困难' };

async function loadRecipes(page = 1) {
    const keyword = document.getElementById('keywordInput').value.trim();
    const grid = document.getElementById('recipeGrid');

    grid.innerHTML = `
        <div class="col-12 text-center py-5">
            <i class="fas fa-spinner fa-spin fa-2x text-primary"></i>
            <p class="mt-3 text-secondary">加载中...</p>
        </div>`;

    const result = await Api.get('/recipes', {
        page: page,
        size: 12,
        keyword: keyword || undefined
    });

    if (!result || result.code !== 200) {
        grid.innerHTML = `<div class="col-12 text-center py-5">
            <i class="fas fa-exclamation-circle fa-2x text-danger"></i>
            <p class="mt-3 text-secondary">加载失败，请稍后重试</p>
        </div>`;
        return;
    }

    const pageData = result.data;
    const records = pageData.records || [];

    if (records.length === 0) {
        grid.innerHTML = `<div class="col-12 text-center py-5">
            <i class="fas fa-utensils fa-3x text-secondary opacity-50"></i>
            <p class="mt-3 text-secondary">暂无菜谱数据</p>
        </div>`;
        document.getElementById('paginationNav').classList.add('d-none');
        return;
    }

    grid.innerHTML = records.map(recipe => `
        <div class="col-md-6 col-lg-4">
            <div class="recipe-card" onclick="showRecipeDetail(${recipe.id})">
                <div class="recipe-card-img">
                    ${recipe.coverUrl
                        ? `<img src="${Utils.escapeHtml(recipe.coverUrl)}" alt="${Utils.escapeHtml(recipe.title)}">`
                        : `<i class="fas fa-utensils recipe-card-img-placeholder"></i>`
                    }
                </div>
                <div class="recipe-card-body">
                    <div class="recipe-card-title">${Utils.escapeHtml(recipe.title)}</div>
                    <div class="recipe-card-desc">${Utils.escapeHtml(recipe.description || '暂无简介')}</div>
                    <div class="recipe-card-meta">
                        <span class="difficulty-${recipe.difficulty}">
                            <i class="fas fa-fire"></i>${difficultyMap[recipe.difficulty] || '未知'}
                        </span>
                        ${recipe.durationMin ? `<span><i class="fas fa-clock"></i>${recipe.durationMin}分钟</span>` : ''}
                        <span><i class="fas fa-heart"></i>${recipe.likeCount || 0}</span>
                        <span><i class="fas fa-eye"></i>${recipe.viewCount || 0}</span>
                    </div>
                </div>
            </div>
        </div>
    `).join('');

    renderPagination(pageData);
}

function renderPagination(pageData) {
    const nav = document.getElementById('paginationNav');
    const ul = document.getElementById('pagination');

    if (pageData.pages <= 1) {
        nav.classList.add('d-none');
        return;
    }

    nav.classList.remove('d-none');
    let html = '';

    if (pageData.current > 1) {
        html += `<li class="page-item"><a class="page-link" href="javascript:loadRecipes(${pageData.current - 1})">上一页</a></li>`;
    }
    for (let i = 1; i <= pageData.pages; i++) {
        html += `<li class="page-item ${i === pageData.current ? 'active' : ''}">
            <a class="page-link" href="javascript:loadRecipes(${i})">${i}</a>
        </li>`;
    }
    if (pageData.current < pageData.pages) {
        html += `<li class="page-item"><a class="page-link" href="javascript:loadRecipes(${pageData.current + 1})">下一页</a></li>`;
    }

    ul.innerHTML = html;
}

async function showRecipeDetail(id) {
    ModalManager.open({
        title: '菜谱详情',
        body: '<div class="text-center"><i class="fas fa-spinner fa-spin fa-2x text-primary"></i><p class="mt-3 text-secondary">加载中...</p></div>',
        showCancel: false,
        confirmText: '关闭'
    });

    const result = await Api.get('/recipes/' + id);
    if (!result || result.code !== 200) {
        ModalManager.open({
            title: '菜谱详情',
            body: '<p class="text-danger">加载失败</p>',
            showCancel: false,
            confirmText: '关闭'
        });
        return;
    }

    const r = result.data;
    ModalManager.open({
        title: r.title || '菜谱详情',
        body: `
            ${r.coverUrl ? `<div class="text-center mb-3"><img src="${Utils.escapeHtml(r.coverUrl)}" style="max-width:100%;border-radius:10px;"></div>` : ''}
            <table class="table table-borderless">
                <tr><td style="width:100px;" class="text-secondary">难度</td><td class="difficulty-${r.difficulty}">${difficultyMap[r.difficulty] || '-'}</td></tr>
                <tr><td class="text-secondary">时长</td><td>${r.durationMin ? r.durationMin + ' 分钟' : '-'}</td></tr>
                <tr><td class="text-secondary">份数</td><td>${r.servings ? r.servings + ' 人份' : '-'}</td></tr>
                <tr><td class="text-secondary">标签</td><td>${r.tags ? Utils.escapeHtml(r.tags) : '-'}</td></tr>
                <tr><td class="text-secondary">点赞</td><td><i class="fas fa-heart text-danger"></i> ${r.likeCount || 0}</td></tr>
                <tr><td class="text-secondary">浏览</td><td><i class="fas fa-eye text-primary"></i> ${r.viewCount || 0}</td></tr>
            </table>
            ${r.description ? `<div class="mt-3"><h6>菜谱简介</h6><p>${Utils.escapeHtml(r.description)}</p></div>` : ''}
        `,
        showCancel: false,
        confirmText: '关闭'
    });
}

document.getElementById('keywordInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') loadRecipes(1);
});

// 从 URL 获取搜索关键词
const urlKeyword = Utils.getQueryParam('q');
if (urlKeyword) {
    document.getElementById('keywordInput').value = urlKeyword;
}

loadRecipes(1);
</script>
</body>
</html>

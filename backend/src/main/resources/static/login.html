<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 智能厨房辅助系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/theme.css">
    <style>
        body {
            background: linear-gradient(135deg, #E3F2FD 0%, #F5F9FC 50%, #E8F5E9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<div class="container" style="max-width: 800px; padding: 40px 20px;">
    <!-- Toast 容器 -->
    <div class="messages-container" id="messagesContainer"></div>

    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card auth-card">
                <div class="card-header">
                    <h3 class="text-center mb-0">
                        <i class="fas fa-utensils me-2"></i>智能厨房辅助系统
                    </h3>
                </div>
                <div class="card-body">
                    <!-- 登录/注册切换标签 -->
                    <ul class="nav nav-tabs mb-4 justify-content-center">
                        <li class="nav-item">
                            <a class="nav-link active" data-bs-toggle="tab" href="#login-tab">登录</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" data-bs-toggle="tab" href="#register-tab">注册</a>
                        </li>
                    </ul>

                    <div class="tab-content">
                        <!-- ========== 登录表单 ========== -->
                        <div class="tab-pane fade show active" id="login-tab">
                            <form id="loginForm" style="max-width: 400px; margin: 0 auto;">
                                <div class="mb-3">
                                    <label class="form-label">用户名</label>
                                    <input type="text" class="form-control" id="loginUsername" required
                                           placeholder="请输入用户名" minlength="2" maxlength="50">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">密码</label>
                                    <input type="password" class="form-control" id="loginPassword" required
                                           placeholder="请输入密码" minlength="6" maxlength="100">
                                </div>
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="rememberMe">
                                    <label class="form-check-label" for="rememberMe">记住我</label>
                                </div>
                                <div id="loginError" class="alert alert-danger" style="display:none;"></div>
                                <button type="submit" class="btn btn-primary w-100" id="loginBtn">
                                    <i class="fas fa-sign-in-alt me-2"></i>登录
                                </button>
                                <div class="mt-3 text-center text-secondary">
                                    <small>初始管理员账号：admin / admin123</small>
                                </div>
                            </form>
                        </div>

                        <!-- ========== 注册表单 ========== -->
                        <div class="tab-pane fade" id="register-tab">
                            <form id="registerForm" style="max-width: 400px; margin: 0 auto;">
                                <div class="mb-3">
                                    <label class="form-label">用户名</label>
                                    <input type="text" class="form-control" id="regUsername" required
                                           placeholder="2-50个字符" minlength="2" maxlength="50">
                                    <div class="form-text text-secondary">用户名长度需在2-50之间</div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">密码</label>
                                    <input type="password" class="form-control" id="regPassword" required
                                           placeholder="6-100个字符" minlength="6" maxlength="100">
                                    <div class="form-text text-secondary">密码长度需在6-100之间</div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">确认密码</label>
                                    <input type="password" class="form-control" id="regPassword2" required
                                           placeholder="请再次输入密码" minlength="6" maxlength="100">
                                </div>
                                <div id="registerError" class="alert alert-danger" style="display:none;"></div>
                                <button type="submit" class="btn btn-primary w-100" id="registerBtn">
                                    <i class="fas fa-user-plus me-2"></i>注册
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/theme.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
// 已登录则跳转
if (Auth.isLoggedIn()) {
    window.location.href = 'ingredients';
}

// 检查 URL hash，自动切换到注册标签
if (window.location.hash === '#register') {
    setTimeout(() => {
        const tab = document.querySelector('a[href="#register-tab"]');
        if (tab) new bootstrap.Tab(tab).show();
    }, 100);
}

// 登录表单提交
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errorDiv = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    if (!username || !password) {
        errorDiv.textContent = '请填写用户名和密码';
        errorDiv.style.display = 'block';
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>登录中...';
    errorDiv.style.display = 'none';

    const result = await Api.post('/auth/login', { username, password });

    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>登录';

    if (result && result.code === 200) {
        Auth.saveLogin(result.data.token, result.data);
        ToastManager.success('登录成功，正在跳转...');
        setTimeout(() => Auth.redirectByRole(), 1000);
    } else {
        errorDiv.textContent = result ? result.message : '登录失败，请检查服务是否启动';
        errorDiv.style.display = 'block';
    }
});

// 注册表单提交
document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const username = document.getElementById('regUsername').value.trim();
    const password = document.getElementById('regPassword').value;
    const password2 = document.getElementById('regPassword2').value;
    const errorDiv = document.getElementById('registerError');
    const btn = document.getElementById('registerBtn');

    if (!username || username.length < 2) {
        errorDiv.textContent = '用户名长度需在2-50之间';
        errorDiv.style.display = 'block';
        return;
    }
    if (!password || password.length < 6) {
        errorDiv.textContent = '密码长度需在6-100之间';
        errorDiv.style.display = 'block';
        return;
    }
    if (password !== password2) {
        errorDiv.textContent = '两次输入的密码不一致';
        errorDiv.style.display = 'block';
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>注册中...';
    errorDiv.style.display = 'none';

    const result = await Api.post('/auth/register', { username, password });

    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-user-plus me-2"></i>注册';

    if (result && result.code === 200) {
        ToastManager.success('注册成功，请登录');
        // 清空注册表单，切换到登录标签
        document.getElementById('registerForm').reset();
        const tab = document.querySelector('a[href="#login-tab"]');
        if (tab) new bootstrap.Tab(tab).show();
        // 自动填充用户名
        document.getElementById('loginUsername').value = username;
    } else {
        errorDiv.textContent = result ? result.message : '注册失败，请检查服务是否启动';
        errorDiv.style.display = 'block';
    }
});
</script>
</body>
</html>
